name: Deploy to MBserver

on:
  push:
    branches:
      - main
      - claude/audit-joinery-business-exX2e
    paths:
      - 'smb-audit/**'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env from secrets
        working-directory: smb-audit
        run: |
          cat > .env << EOF
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"
          MYSQL_USER="${{ secrets.MYSQL_USER }}"
          MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}"
          SITE_PASSWORD="${{ secrets.SITE_PASSWORD }}"
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"
          EOF

      - name: Stop existing containers
        working-directory: smb-audit
        run: docker compose down --remove-orphans || true

      - name: Build and start
        working-directory: smb-audit
        run: docker compose up -d --build

      - name: Run DB migrations
        working-directory: smb-audit
        run: |
          sleep 5
          for f in sql/migrate_*.sql; do
            echo "Running migration: $f"
            docker compose exec -T db mysql -u"${{ secrets.MYSQL_USER }}" -p"${{ secrets.MYSQL_PASSWORD }}" smb_audit < "$f"
          done

      - name: Verify running
        run: |
          sleep 5
          docker ps | grep smb-audit-app && echo "✅ App is running" || echo "❌ WARNING: App container not found"
